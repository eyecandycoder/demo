# Databricks Asset Bundle: deploys the notebooks and a job that runs the semantic layer pipeline.
# Uses serverless jobs compute by default; add a job_clusters block if your workspace needs one.
bundle:
  name: scalable-semantic-layer

resources:
  jobs:
    deploy_semantic_layer:
      name: deploy-semantic-layer
      tasks:
        - task_key: deploy
          notebook_task:
            notebook_path: ./notebooks/02_deploy_semantic_layer.py
            base_parameters:
              domain_dirs: domains

targets:
  dev:
    mode: development
    default: true
  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
